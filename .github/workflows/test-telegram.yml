name: Probar notificaciones Telegram

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: Destino según el orden de TELEGRAM_CHAT_IDS
        type: choice
        options: [all, '1', '2']
        default: all
      identity_public_key:
        description: Clave pública PEM opcional para consultar el nombre cifrado sin enviar mensajes
        type: string
        required: false

permissions:
  contents: read

jobs:
  test_telegram:
    if: github.repository == 'marcomolinaleija/cliente-xmpp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Enviar prueba a los chats configurados
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_NOTIFICATION_TEST: '1'
          TELEGRAM_TEST_RECIPIENT: ${{ inputs.recipient }}
          TELEGRAM_IDENTITY_PUBLIC_KEY: ${{ inputs.identity_public_key }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python tools/ci/notify_telegram.py
