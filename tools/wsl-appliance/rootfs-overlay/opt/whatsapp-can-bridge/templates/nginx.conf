user www-data;
worker_processes 1;
pid /run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /var/log/nginx/error.log warn;
    sendfile on;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        location /whatsapp/ {
            alias /var/lib/whatsapp-can-bridge/attachments/;
            autoindex off;
            try_files $uri =404;
        }
    }
}
