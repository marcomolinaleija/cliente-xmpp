[package]
name = "can-reference-decoder"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "can-reference-decoder"
path = "main.rs"

[dependencies]
log = "=0.4.28"
thiserror = "=2.0.17"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
buffa = { version = "=0.9.2", default-features = false, features = ["std", "json"] }
zerocopy = { version = "=0.8.55", features = ["derive"] }
flate2 = "=1.1.9"

[build-dependencies]
buffa-build = { version = "=0.9.2", default-features = false }
